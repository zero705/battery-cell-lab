name: CodeQL

on:
  push:
  pull_request:
  schedule:
    # Weekly, so that new queries also run on code that has not changed.
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.
jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # to upload the results to the repository's code scanning
    strategy:
      fail-fast: false
      matrix:
        # python: the package, the app and the tools; actions: these workflow files.
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
