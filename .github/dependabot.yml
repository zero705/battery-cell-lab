version: 2
updates:
  # Python dependencies: pyproject.toml and the pinned app requirements in requirements.txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # A release is only suggested once it is a week old, so a bad release that gets pulled
    # within a few days never reaches this repository.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # One pull request a month for all of them, tested together.
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # All actions in one pull request: the CodeQL init and analyze steps must keep the same
    # version, so they can't be updated one at a time.
    groups:
      actions:
        patterns: ["*"]
